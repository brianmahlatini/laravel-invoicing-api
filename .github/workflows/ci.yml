name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
        db: [sqlite]
        include:
          - php: "8.4"
            db: mysql
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s --health-retries 20
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ${{ matrix.db == 'mysql' && 'testing' || ':memory:' }}
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, mbstring
          coverage: none
      - run: composer validate
      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist 2>&1 | tee /tmp/composer.log || {
            echo "::error title=composer install::$(tail -20 /tmp/composer.log | tr '\n' '|' )"; exit 1; }
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test --log-junit junit.xml
      - if: failure()
        run: python3 .github/scripts/junit-annotate.py junit.xml
      - run: composer audit
